  LastUpdated: 2026-07-27

memory:

  id: semantic-memory

  name: Semantic Memory

  description: >
    Persistent memory storing reusable knowledge,
    engineering concepts, patterns and relationships.

  purpose: >
    Provide long-term knowledge shared across
    missions, workflows and agents.

  type: semantic

  scope: project

  retention: persistent

  owner: OSEF Foundation

  storage: ./knowledge

  encryption: false

  classification: public

  policies:
    - knowledge-policy

  sources:
    - knowledge-base

  consumers:
    - search
    - web-search
